name: YouTube Virality Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-report:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare batch input if present
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          batches = sorted(Path("batches").glob("batch_*.csv"))
          if batches:
              data = pd.concat(
                  (pd.read_csv(path) for path in batches),
                  ignore_index=True,
              )
              data.to_csv("viral_videos.csv", index=False)
              print(f"Loaded {len(batches)} batches and {len(data):,} rows")
          else:
              print("No batches found. Using the full viral_videos.csv.")
          PY

      - name: Clean data
        run: python data_cleaning.py

      - name: Calculate indicators and generate EDA charts
        run: python EDA_indicators.py

      - name: Train and evaluate models
        run: python Machine_Learning_Modelling.py

      - name: Generate HTML report
        run: python export_report.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: youtube-virality-report
          path: virality_report.html
          if-no-files-found: error
